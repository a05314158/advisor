        <path d="M58 78 Q58 66 74 66 Q192 55 318 72 Q332 73 331 87 L327 206 Q327 233 302 238 Q192 248 82 235 Q59 231 57 208 Q53 144 58 78Z" fill="none" stroke="#897864" stroke-opacity=".77" stroke-width="1.35" stroke-dasharray="1.5 4" stroke-linecap="round"/>

          <span class="caption pocket-empty" id="pocketEmpty" hidden>Кошелёк пуст</span>

  <script>
    const $=id=>document.getElementById(id);let catalog=[],saved=[],manual=[],banks=[],categories={supermarkets:'Супермаркеты',cafe:'Кафе',fuel:'АЗС'},loading=false,authMode='register',deviceLogin=null;
    function readDevice(){try{return JSON.parse(localStorage.getItem('advisor-device')||'null')}catch{return null}}

    let purchasePending=false,purchaseAttempt=null;
    async function lockPurchase(cardId){const amount=kopecksOf($('buyAmount').value);if(purchasePending||!buyCategory||!amount)return;const body={categoryId:buyCategory,amountKopecks:amount,chosenCardId:cardId};const signature=JSON.stringify(body);if(purchaseAttempt?.signature!==signature)purchaseAttempt={signature,id:Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')};purchasePending=true;$('buyPanel').inert=true;try{const saved=await api('/api/me/purchases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,requestId:purchaseAttempt.id})});purchaseAttempt=null;toast(`Записано ${money(saved.calculatedKopecks)}`);$('buyAmount').value='';$('buyResults').replaceChildren();$('buyStatus').textContent='Покупка записана'}catch(error){toast(error.message)}finally{purchasePending=false;$('buyPanel').inert=false}}
    function fillCashbackCards(){const select=$('cashbackCard');const current=select.value;select.replaceChildren(new Option('Новая карта',''));for(const card of manual)select.append(new Option(card.name,card.cardId));select.value=[...select.options].some(option=>option.value===current)?current:''}
    $('addCardBtn').addEventListener('click',openAddCard);
    $('closeAdd').addEventListener('click',()=>{$('addDialog').hidden=true});
    $('addDialog').addEventListener('click',event=>{if(event.target===$('addDialog'))$('addDialog').hidden=true});
    $('addCardForm').addEventListener('submit',async event=>{event.preventDefault();const bank=banks.find(item=>item.id===$('newBank').value);try{await api('/api/me/manual-cards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:bank.name,rules:[]})});$('addDialog').hidden=true;toast(`Добавлен ${bank.name}`);await load()}catch(error){toast(error.message)}});
    // Screenshot review and monthly planning are attached by wallet-cashback.js.
    $('showCashbackBtn').addEventListener('click',()=>{const view=$('cashbackView');view.hidden=!view.hidden;view.replaceChildren();if(view.hidden)return;if(!manual.length){view.textContent='Карт с кешбэком пока нет';return}for(const card of manual){const block=document.createElement('article');block.className='saved-card';const lines=(card.rules||[]).map(rule=>`${rule.label||categories[rule.categoryId]||rule.categoryId} ${formatRate(rule.rateBps)}%`).join(', ')||'Кешбэк не добавлен';block.innerHTML=`<div class="saved-info"><strong>${escapeHtml(card.name)}</strong><small>${escapeHtml(lines)}</small></div>`;view.append(block)}});
    function rub(value){return value==null?'—':money(value)}
    $('showStatsBtn').addEventListener('click',async()=>{const box=$('statsBox');box.hidden=false;box.textContent='Считаем…';try{const data=await api('/api/me/stats');box.replaceChildren();const note=document.createElement('p');note.textContent=data.note;const lines=document.createElement('p');lines.textContent=`Покупок: ${data.count}. По выбранным картам: ${money(data.calculatedKopecks)}. Если бы всегда брали лучшую: ${money(data.recommendedKopecks)}. Недобор: ${money(data.missedKopecks)}. К обычной карте: ${rub(data.versusUsualKopecks)}.`;const ask=document.createElement('button');ask.type='button';ask.textContent='Разобрать месяц';ask.addEventListener('click',async()=>{ask.disabled=true;try{const reply=await api('/api/me/stats/comment',{method:'POST'},45000);const comment=document.createElement('p');comment.textContent=reply.comment;box.append(comment)}catch(error){toast(error.message)}finally{ask.disabled=false}});box.append(note,lines,ask)}catch(error){box.textContent=error.message}});
    async function openSettings(){const select=$('usualCard');select.replaceChildren(new Option('Не выбрана',''));for(const card of manual)select.append(new Option(card.name,card.cardId));try{const data=await api('/api/me/stats');if(data.usualCardId)select.value=data.usualCardId}catch{}$('settingsDialog').hidden=false}
    $('settingsOpen').addEventListener('click',openSettings);
    $('closeSettings').addEventListener('click',()=>{$('settingsDialog').hidden=true});
    $('settingsDialog').addEventListener('click',event=>{if(event.target===$('settingsDialog'))$('settingsDialog').hidden=true});
    $('usualCard').addEventListener('change',async()=>{if(!$('usualCard').value)return;try{await api('/api/me/usual-card',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({cardId:$('usualCard').value})});toast('Обычная карта сохранена')}catch(error){toast(error.message)}});
    const originalLoad=load;
    load=async function(){await originalLoad();paintCategories();document.dispatchEvent(new Event('wallet-updated'))};
    for (const [name, read, write] of [['$',()=>$,null],['banks',()=>banks,value=>{banks=value}],['manual',()=>manual,value=>{manual=value}],['categories',()=>categories,value=>{categories=value}],['deviceLogin',()=>deviceLogin,value=>{deviceLogin=value}],['carouselPos',()=>carouselPos,null]]) Object.defineProperty(window,name,{get:read,set:write||(()=>{}),configurable:true});
    checkAuth();
  </script>
  <script src="/wallet-cashback.js"></script>
</body>
</html>
