name: Advisor CI/CD

on:
  push:
    branches-ignore:
      - deploy/staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test application and deployment scripts
        env:
          ADVISOR_DB: ${{ runner.temp }}/advisor-unit.sqlite3
        run: |
          python -m unittest -v
          bash -n deploy/install.sh
          bash -n deploy/update.sh
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Exercise visible wallet in the release archive
        run: |
          release=$(mktemp -d)
          trap 'rm -rf -- "$release"' EXIT
          git archive "$GITHUB_SHA" | tar -x -C "$release"
          cd "$release"
          python tests/browser_mvp.py --artifacts "$RUNNER_TEMP/advisor-screens" --revision "$GITHUB_SHA"
      - name: Keep viewport screenshots, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: advisor-wallet-screenshots
          path: ${{ runner.temp }}/advisor-screens/*.png
          if-no-files-found: warn
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish the tested revision for the staging VM
        run: |
          latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer revision is on main."
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/deploy/staging"
