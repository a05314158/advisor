name: Advisor CI/CD

on:
  push:
    branches-ignore:
      - deploy/staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Test application and check deployment scripts
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m unittest -v
          bash -n deploy/install.sh
          bash -n deploy/update.sh

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish the tested revision for the staging VM
        run: |
          latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer revision is on main."
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/deploy/staging"
